server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Stable routes reserved for repositories that do not yet implement an API.
    # Return an honest 503 instead of a frontend page or a fake healthy service.
    location ~ ^/api/(payments|notifications|chat|support|administrator)(/|$) {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"not_implemented","message":"Service reserved; application implementation is pending"}';
    }

    # Expo exports individual HTML routes; do not mask missing routes as 200.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location /_expo/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
